$schema: https://git.drupalcode.org/project/drupal/-/raw/10.1.x/core/modules/sdc/src/metadata.schema.json
name: Document download
libraryOverrides:
  js:
    clickable-items_document-download-apply.js: {}
  dependencies:
    - csgov_theme/clickable-items
props:
  type: object
  properties:
    document_color:
      type: [string, 'null']
      title: Color variant
    document_type:
      type: [string, 'null']
      title: File type
    document_url:
      type: [string, 'null']
      title: File URL
    document_name:
      type: [string, object, 'null']
      title: Document name
    document_filename:
      type: [string, 'null']
      title: File name
    document_size:
      type: [string, 'null']
      title: File size
    document_pages:
      type: [string, integer, 'null']
      title: Number of pages
