$schema: https://git.drupalcode.org/project/drupal/-/raw/10.1.x/core/modules/sdc/src/metadata.schema.json
name: Address Book
props:
  type: object
  required:
    - address_book_title
  properties:
    address_book_title:
      type: string
      title: Name
      description: Name of the address book item
    address_book_position:
      type: string
      title: Job Position
    address_book_email:
      type: string
      title: Email
    address_book_mobile:
      type: string
      title: Mobile phone number
    address_book_phone:
      type: string
      title: Landline
    address_book_image:
      type: string
      title: Image
